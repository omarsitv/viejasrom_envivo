<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viejas Romanticas- Radio En Vivo</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at 50% 50%, #2b2b2b, #0a0a0a);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL ESTILO SPOTIFY */
    .player-container {
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      padding: 30px 20px 25px 20px;
      color: #fff;
    }

    /* CLASES DE TEMAS DE COLOR */
    .theme-dark       { background: linear-gradient(180deg, #2a2a2a 0%, #121212 40%, #121212 100%); }
    .theme-brick      { background: linear-gradient(180deg, #8b3a3a 0%, #3e1212 40%, #121212 100%); }
    .theme-green      { background: linear-gradient(180deg, #2e4f2e 0%, #0f240f 40%, #121212 100%); }
    .theme-brown      { background: linear-gradient(180deg, #6b4c3a 0%, #362216 40%, #121212 100%); }
    .theme-blue       { background: linear-gradient(180deg, #1a365d 0%, #0f172a 40%, #121212 100%); }
    .theme-gray       { background: linear-gradient(180deg, #52525b 0%, #27272a 40%, #121212 100%); }
    .theme-pink       { background: linear-gradient(180deg, #be185d 0%, #831843 40%, #121212 100%); }
    .theme-bordeaux   { background: linear-gradient(180deg, #68102b 0%, #320211 40%, #121212 100%); }
    .theme-lightblue  { background: linear-gradient(180deg, #0284c7 0%, #0c4a6e 40%, #121212 100%); }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mini-logo {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .header-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .header-subtitle {
      font-size: 11px;
      color: #1db954;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* BOTÓN SELECTOR DE TEMA */
    .theme-btn {
      background: transparent;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.2s;
    }
    .theme-btn:hover {
      color: #fff;
    }
    .theme-btn:active {
      transform: scale(0.9);
    }

    /* PORTADA DEL ÁLBUM */
    .artwork-container {
      width: 100%;
      aspect-ratio: 1;
      margin-bottom: 35px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      overflow: hidden;
    }
    #imgTrack {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    /* INFORMACIÓN DE LA PISTA */
    .track-info {
      display: flex;
      flex-direction: column;
      margin-bottom: 25px;
      padding: 0 5px;
    }
    #songTitle {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    #artistName {
      font-size: 16px;
      color: #b3b3b3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* BARRA DE PROGRESO */
    .progress-area {
      margin-bottom: 25px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #4d4d4d;
      border-radius: 2px;
      position: relative;
      margin-bottom: 10px;
    }
    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 2px;
      transition: width 1s linear;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -4px;
      top: -4px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .progress-area:hover .progress-fill::after {
      opacity: 1;
    }
    .progress-area:hover .progress-fill {
      background: #1db954;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #a7a7a7;
      font-variant-numeric: tabular-nums;
    }

    /* CONTROLES DE REPRODUCCIÓN */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }
    .btn-icon {
      background: transparent;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.2s;
    }
    .btn-icon:active {
      transform: scale(0.9);
      color: #b3b3b3;
    }
    .btn-icon svg {
      fill: currentColor;
    }
    
    .btn-play-pause {
      width: 64px;
      height: 64px;
      background: #fff;
      color: #000;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-play-pause:active {
      transform: scale(0.95);
      background: #e6e6e6;
    }
    .btn-play-pause svg {
      fill: currentColor;
      width: 28px;
      height: 28px;
    }

    /* HORA ARGENTINA Y CRÉDITOS */
    .arg-time-container {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    .arg-time-label {
      font-size: 12px;
      color: #a7a7a7;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .arg-time-clock {
      font-size: 18px;
      color: #1db954;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .creator-credits {
      font-size: 11px;
      color: #777;
      letter-spacing: 0.5px;
    }

    .hidden-elements { display: none; }
  </style>
</head>
<body>

  <div class="player-container theme-dark" id="playerContainer">
    
    <!-- CABECERA CON SELECTOR DE TEMA -->
    <div class="header">
      <div class="header-left">
        <img class="mini-logo" src="https://imgfz.com/i/Em08gOQ.png" alt="Logo Radio">
        <div>
          <div class="header-text">Viejas Romanticas</div>
          <div class="header-subtitle">En Vivo</div>
        </div>
      </div>
      
      <!-- BOTÓN DE COLORES -->
      <button class="theme-btn" id="btnTheme" title="Cambiar color de fondo">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.38 0 2.5-1.12 2.5-2.5 0-.61-.23-1.21-.64-1.67-.08-.09-.13-.21-.13-.33 0-.28.22-.5.5-.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm-4 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.5-4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm4.5 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.5 4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
        </svg>
      </button>
    </div>

    <!-- PORTADA -->
    <div class="artwork-container">
      <img id="imgTrack" src="https://imgfz.com/i/Em08gOQ.png" alt="Portada Artista">
    </div>

    <!-- INFO PISTA -->
    <div class="track-info">
      <div id="songTitle">Conectando...</div>
      <div id="artistName">Viejas Romanticas</div>
    </div>

    <!-- BARRA DE PROGRESO -->
    <div class="progress-area">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-info">
        <span id="time">00:00</span>
        <span>LIVE</span>
      </div>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
      <button class="btn-icon" title="Anterior">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M7 6v12h2V6H7zm10 12l-7-6 7-6v12z"/></svg>
      </button>
      
      <button class="btn-play-pause" id="pp" title="Reproducir/Pausar">
        <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button class="btn-icon" title="Siguiente">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M15 6v12h2V6h-2zM5 18l7-6-7-6v12z"/></svg>
      </button>
    </div>

    <!-- HORA DE BUENOS AIRES Y CRÉDITOS -->
    <div class="arg-time-container">
      <div class="arg-time-label">Hora en Buenos Aires</div>
      <div class="arg-time-clock" id="relojArg">00:00:00</div>
      <div class="creator-credits">( Creado por Omarsi &reg; )</div>
    </div>

    <!-- AUDIO OCULTO -->
    <audio id="audioRadio" crossorigin="anonymous" Autoplay></audio>
    <div class="hidden-elements">
      <div id="num"></div>
      <canvas id="viz" width="238" height="80"></canvas>
      <span id="title"></span>
      <div id="st"></div>
      <div id="digitalDateTime"></div>
      <div id="knob"></div>
      <div id="vol"></div>
    </div>
  </div>

<script>
(function(){
  // --- LÓGICA DEL SELECTOR DE TEMAS AMPLIADA ---
  var themes = [
    'theme-dark', 
    'theme-brick', 
    'theme-green', 
    'theme-brown', 
    'theme-blue', 
    'theme-gray', 
    'theme-pink', 
    'theme-bordeaux', 
    'theme-lightblue'
  ];
  var currentThemeIndex = 0;
  var playerContainer = document.getElementById('playerContainer');
  var btnTheme = document.getElementById('btnTheme');

  btnTheme.addEventListener('click', function() {
    playerContainer.classList.remove(themes[currentThemeIndex]);
    currentThemeIndex = (currentThemeIndex + 1) % themes.length;
    playerContainer.classList.add(themes[currentThemeIndex]);
  });
  // ------------------------------------

  var audio = document.getElementById('audioRadio');
  var playing = true; 
  
  var iconPlay = document.getElementById('icon-play');
  var iconPause = document.getElementById('icon-pause');
  var progressFill = document.getElementById('progressFill');

  var sec = 0;
  var tm = document.getElementById('time');
  function fmt(n) { return n < 10 ? '0' + n : n; }
  
  function showTime() {
    tm.textContent = fmt(Math.floor(sec / 60) % 60) + ':' + fmt(sec % 60);
    var fakeProgress = (sec % 180) / 180 * 100;
    progressFill.style.width = fakeProgress + '%';
  }
  
  setInterval(function(){ 
    if(playing) { sec++; showTime(); } 
  }, 1000);

  /* === RELOJ DE BUENOS AIRES === */
  function actualizarRelojBsAs() {
    var opciones = { 
      timeZone: 'America/Argentina/Buenos_Aires', 
      hour: '2-digit', 
      minute: '2-digit', 
      second: '2-digit', 
      hour12: false 
    };
    var formateador = new Intl.DateTimeFormat('es-AR', opciones);
    document.getElementById('relojArg').textContent = formateador.format(new Date());
  }
  setInterval(actualizarRelojBsAs, 1000);
  actualizarRelojBsAs(); // Llamada inicial
  /* ============================= */

  function speakLiveVoice(){
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance("");
      u.lang = 'es-US'; u.rate = 1.0; u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }
  }

  function updatePlayState(){
    if(playing){
      var playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          speakLiveVoice();
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
        }).catch(function(error) {
          console.log("Autoplay bloqueado por el navegador:", error);
          playing = false;
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
        });
      }
    } else {
      audio.pause();
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    }
  }

  document.getElementById('pp').onclick = function(){
    playing = !playing;
    updatePlayState();
  };

  var STREAM_URL = "https://stream.zeno.fm/urmfkad2em0uv";
  var DEFAULT_IMG = "https://imgfz.com/i/Em08gOQ.png";

  var MOUNT = STREAM_URL.split('/').pop().split('?')[0];
  audio.src = STREAM_URL;
  
  updatePlayState();

  var lastTrack = "";

  function setCover(url){
    $('#imgTrack').css('opacity', 0);
    setTimeout(function(){
      $('#imgTrack').attr('src', url).css('opacity', 1);
    }, 300);
  }

  function findCover(artist, song, apiImg){
    var clean = (artist + " " + song).replace(/[\(\[].*?[\)\]]/g, "").trim();
    $.ajax({
      url: "https://itunes.apple.com/search?term=" + encodeURIComponent(clean) + "&media=music&limit=1",
      dataType: "jsonp",
      timeout: 6000,
      success: function(res){
        if(res.results && res.results.length && res.results[0].artworkUrl100){
          setCover(res.results[0].artworkUrl100.replace('100x100bb','600x600bb')); 
        } else {
          setCover(apiImg || DEFAULT_IMG);
        }
      },
      error: function(){ setCover(apiImg || DEFAULT_IMG); }
    });
  }

  function handleTitle(full, apiImg){
    full = (full || "").trim();
    if(!full || full === lastTrack) return;
    lastTrack = full;

    var parts = full.split(" - ");
    var artist = parts.length > 1 ? parts[0].trim() : "Viejas Romanticas";
    var song = parts.length > 1 ? parts.slice(1).join(" - ").trim() : full;

    $('#artistName').text(artist);
    $('#songTitle').text(song);
    findCover(artist, song, apiImg);
  }

  var sseOk = false, es = null;
  function startSSE(){
    if(!window.EventSource) return startPolling();
    es = new EventSource("https://api.zeno.fm/mounts/metadata/subscribe/" + MOUNT);
    es.onmessage = function(ev){
      try{
        var d = JSON.parse(ev.data);
        if(d.streamTitle){ sseOk = true; handleTitle(d.streamTitle); }
      } catch(e){}
    };
    es.onerror = function(){ console.log("Reconectando metadatos..."); };
    setTimeout(function(){ if(!sseOk) startPolling(); }, 10000);
  }

  var polling = false;
  function startPolling(){
    if(polling) return;
    polling = true;
    function poll(){
      $.getJSON("https://twj.es/get_stream_title/?url=" + encodeURIComponent(STREAM_URL), function(d){
        var title = d.title || d.streamTitle || d.stream_title || d.StreamTitle || "";
        var img = d.cover || d.image || d.img || d.artwork || d.cover_url || "";
        handleTitle(title, img);
      }).fail(function(){ console.log("Respaldo de metadatos no disponible."); });
    }
    poll();
    setInterval(poll, 15000);
  }

  startSSE();
})();
</script>
</body>
</html>
